<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHA/ACSM 健身篩查問卷</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>AHA/ACSM 健身篩查問卷</h1>

<ul class="progressbar">
<li class="active">個人資訊</li>
<li>健康狀況</li>
<li>運動歷史</li>
<li>藥物/傷病</li>
<li>完成</li>
</ul>

<form id="surveyForm">

<fieldset class="active">
<label>姓名:</label>
<input type="text" id="name" required>

<label>年齡:</label>
<input type="number" id="age" min="10" max="120" required>

<label>性別:</label>
<select id="gender" required>
<option value="">請選擇</option>
<option value="male">男性</option>
<option value="female">女性</option>
<option value="other">其他</option>
</select>

<button type="button" onclick="nextPrev(1)">下一步</button>
</fieldset>

<fieldset>
<div class="question">
<label>1. 是否有已知心血管、代謝或腎臟疾病？</label>
<input type="radio" name="q1" value="yes"> 是
<input type="radio" name="q1" value="no"> 否
</div>
<div class="question">
<label>2. 是否有胸痛、心悸、頭暈或暈倒經驗？</label>
<input type="radio" name="q2" value="yes"> 是
<input type="radio" name="q2" value="no"> 否
</div>
<button type="button" onclick="nextPrev(-1)">上一步</button>
<button type="button" onclick="nextPrev(1)">下一步</button>
</fieldset>

<fieldset>
<div class="question">
<label>3. 過去是否定期運動？</label>
<input type="radio" name="q3" value="yes"> 是
<input type="radio" name="q3" value="no"> 否
</div>
<button type="button" onclick="nextPrev(-1)">上一步</button>
<button type="button" onclick="nextPrev(1)">下一步</button>
</fieldset>

<fieldset>
<div class="question">
<label>4. 最近是否有受傷或手術導致運動受限？</label>
<input type="radio" name="q4" value="yes"> 是
<input type="radio" name="q4" value="no"> 否
</div>
<div class="question">
<label>5. 是否長期服用影響心血管或代謝的藥物？</label>
<input type="radio" name="q5" value="yes"> 是
<input type="radio" name="q5" value="no"> 否
</div>
<button type="button" onclick="nextPrev(-1)">上一步</button>
<button type="button" onclick="nextPrev(1)">完成</button>
</fieldset>

<fieldset>
<div id="result"></div>
</fieldset>

</form>

<script src="script.js"></script>
</body>
</html>
